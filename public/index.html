<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioNitroz Studio Console: Member</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>RadioNitroz Studio Console</h1>
  <div id="who-am-i" aria-live="polite"></div>
</header>

<main>

  <!-- Login panel, shown when logged out -->
  <section id="login-panel" class="panel" aria-labelledby="login-heading">
    <h2 id="login-heading">Sign in</h2>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit">Sign in</button>
      <p id="login-error" role="alert" class="visually-hidden"></p>
    </form>
  </section>

  <!-- Dashboard, shown when logged in -->
  <div id="dashboard" hidden>

    <section class="panel" aria-labelledby="slots-heading">
      <h2 id="slots-heading">Studio slots</h2>
      <table>
        <caption class="visually-hidden">Available and booked studio slots</caption>
        <thead>
          <tr>
            <th scope="col">Show</th>
            <th scope="col">Date</th>
            <th scope="col">Time</th>
            <th scope="col">Status</th>
            <th scope="col"><span class="visually-hidden">Action</span></th>
          </tr>
        </thead>
        <tbody id="slots-body">
          <tr><td colspan="5">Loading slots…</td></tr>
        </tbody>
      </table>
    </section>

    <section class="panel" aria-labelledby="submit-heading">
      <h2 id="submit-heading">Submit content for review</h2>
      <form id="submission-form">
        <div class="field">
          <label for="content-title">Title</label>
          <input type="text" id="content-title" name="content_title" required>
        </div>
        <div class="field">
          <label for="content-notes">Notes</label>
          <textarea id="content-notes" name="content_notes" rows="3"></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="my-submissions-heading">
      <h2 id="my-submissions-heading">My submissions</h2>
      <table>
        <caption class="visually-hidden">Your submitted content and its review status</caption>
        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Submitted</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody id="submissions-body">
          <tr><td colspan="3">Loading submissions…</td></tr>
        </tbody>
      </table>
    </section>

    <button id="logout-btn" class="secondary" type="button">Sign out</button>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

</main>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
